<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#ccff33" stop-opacity=".35"/><stop offset="1" stop-color="#ccff33" stop-opacity="0"/></radialGradient>
    <g id="leaf"><path d="M0 0C14-17 46-17 64 0 46 17 14 17 0 0Z"/><path d="M3 0H58" fill="none" stroke="#004b23" stroke-opacity=".55" stroke-width="1.5"/></g>
  </defs>

  <circle cx="120" cy="110" r="70" fill="url(#halo)"><animate attributeName="r" values="60;78;60" dur="4s" repeatCount="indefinite"/></circle>

  <!-- soil -->
  <ellipse cx="120" cy="228" rx="72" ry="12" fill="#004b23"/>
  <path d="M70 226Q120 200 170 226Z" fill="#006400"/>

  <!-- stem -->
  <path d="M120 215C120 180 112 150 120 100" pathLength="1" fill="none" stroke="#38b000" stroke-width="5" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;.4;.9;1" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- leaves -->
  <g transform="translate(118 172) rotate(-155)"><use href="#leaf" fill="#70e000"><animateTransform attributeName="transform" type="scale" values="0;0;1;1;0" keyTimes="0;.2;.35;.9;1" dur="8s" repeatCount="indefinite"/></use></g>
  <g transform="translate(120 148) rotate(-25)"><use href="#leaf" fill="#38b000"><animateTransform attributeName="transform" type="scale" values="0;0;1;1;0" keyTimes="0;.3;.45;.9;1" dur="8s" repeatCount="indefinite"/></use></g>
  <g transform="translate(118 124) rotate(-150)"><use href="#leaf" fill="#9ef01a"><animateTransform attributeName="transform" type="scale" values="0;0;1;1;0" keyTimes="0;.4;.55;.9;1" dur="8s" repeatCount="indefinite"/></use></g>
  <g transform="translate(120 102) rotate(-90)"><use href="#leaf" fill="#ccff33"><animateTransform attributeName="transform" type="scale" values="0;0;1.2;1.2;0" keyTimes="0;.5;.65;.9;1" dur="8s" repeatCount="indefinite"/></use></g>

  <!-- pollen -->
  <circle cx="90" cy="120" r="2.5" fill="#ccff33"><animate attributeName="cy" values="140;60" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="155" cy="130" r="2" fill="#9ef01a"><animate attributeName="cy" values="150;70" dur="6s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="-2s" repeatCount="indefinite"/></circle>
  <circle cx="125" cy="90" r="2" fill="#70e000"><animate attributeName="cy" values="120;40" dur="7s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="-4s" repeatCount="indefinite"/></circle>
</svg>